
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Notas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="contenedor">
        <h1>Formulario de Notas</h1>

        <form method="POST" action="{{ url_for('ejercicio1') }}">

            <label>Nota 1:</label>
            <input type="number" name="nota1" min="10" max="70" step="0.1" required>

            <label>Nota 2:</label>
            <input type="number" name="nota2" min="10" max="70" step="0.1" required>

            <label>Nota 3:</label>
            <input type="number" name="nota3" min="10" max="70" step="0.1" required>

            <label>Asistencia (%):</label>
            <input type="number" name="asistencia" min="0" max="100" step="0.1" required>

            <button type="submit" class="boton">Enviar</button>

        </form>{% if promedio is defined %}
    <h2>Resultado de la evaluación</h2>
    <p>Promedio obtenido: {{ promedio }}</p>
    <h2>{{ estado }}</h2>
{% endif %}

        <a href="{{ url_for('inicio') }}">Volver al menú principal</a>
    </div>

</body>
</html>
